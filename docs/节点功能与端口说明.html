<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Studio · 节点功能与端口说明</title>
<style>
:root{--bg:#10131b;--panel:#181d28;--line:#2b3343;--muted:#9da8ba;--text:#f3f5f8;--blue:#8ab4f8;--green:#34d399;--pink:#f472b6;--gold:#fbbf24;--purple:#c084fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#283959 0,#10131b 38%);color:var(--text);font:15px/1.6 Inter,"Microsoft YaHei",sans-serif}header{padding:64px max(28px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line)}h1{font-size:38px;letter-spacing:-1px;margin:0 0 12px}.lead{max-width:790px;color:var(--muted);font-size:17px}.wrap{max-width:1180px;margin:auto;padding:32px 28px 80px}.notice{background:#16263a;border:1px solid #31527b;border-radius:14px;padding:16px 18px;color:#c7dbf6;margin-bottom:26px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}.filters button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 13px;cursor:pointer}.filters button.active{background:#e7f0ff;color:#152039;border-color:#e7f0ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(345px,1fr));gap:14px}.card{background:linear-gradient(145deg,#1b2130,#151923);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:15px;padding:20px;box-shadow:0 12px 30px #0002}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag,.kind{font-size:12px;border-radius:999px;padding:3px 9px;background:#253047;color:#b9c7dd}.kind{background:#213a34;color:#9ee8c7}.retired{background:#41262e;color:#ffb7c2}h2{font-size:22px;margin:10px 0 5px}.purpose{color:#cbd3e1;min-height:50px}.section{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}.section h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}.port{display:grid;grid-template-columns:9px 1fr;gap:9px;margin:8px 0}.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--port)}.port b{font-weight:650}.port small{display:block;color:var(--muted);line-height:1.45}.empty{color:var(--muted);font-style:italic}.foot{color:var(--muted);margin-top:30px;font-size:13px}@media(max-width:600px){header{padding:42px 20px}.wrap{padding:24px 16px}.grid{grid-template-columns:1fr}h1{font-size:30px}}
</style></head><body>
<header><h1>节点功能与端口说明</h1><p class="lead">Canvas Studio 画布节点的审阅手册。每一张卡片说明节点做什么、应该接收什么、会产生什么，以及输出在何时可被下游安全使用。</p></header>
<main class="wrap"><div class="notice"><strong>阅读规则：</strong>端口类型必须匹配才可连接（文本与 Markdown 可互通；<code>any</code> 可接任意类型）。标有“必填”的端口缺失时节点不会执行。模型/处理节点的输出只在本次运行成功后提供；素材节点的输出来自已保存素材。</div><div class="filters" id="filters"></div><section class="grid" id="grid"></section><p class="foot">依据当前节点注册表生成 · 历史兼容节点也保留说明，但不会出现在新建菜单中。</p></main>
<script>
const C={input:'#8ab4f8',image:'#34d399',video:'#f472b6',audio:'#fbbf24',logic:'#c084fc'};
const p=(name,type,desc,required=false,many=false)=>({name,type,desc,required,many});
const nodes=[
['文本','素材输入','input','编辑与汇合原始文本。运行时会把上游文本并入节点正文，适合作为提示词、脚本和说明的起点。',[p('文本','text','可接多个上游文本，与节点内正文合并。',false,true)],[p('文本','text','最终保存的纯文本，可立即被下游读取。')]],
['图片','素材输入','input','导入、保存和预览一张图片；不进行生成或修改。',[],[p('图片','image','已落盘图片资产的引用。')]],
['裁剪','图像处理','image','对一张图片作矩形或透视裁剪，原图不会被改写。',[p('原图','image','待裁剪的单张源图片。',true)],[p('裁剪图','image','成功裁剪后生成的新图片资产。')]],
['拆分','图像处理','image','按行列把一张图片拆为多张，用于宫格、分镜或批量处理。',[p('原图','image','按从左到右、从上到下拆分的源图片。',true)],[p('当前图片','image','当前选中的单格，适合接图片类下游。'),p('图片集合','json','全部格子的图片资产列表，适合接“循环”逐项处理。')]],
['生图','模型生成','input','根据提示词及有序参考图片调用图片模型，生成并保存一张新图。',[p('参考图','image','可接 1～4 张，按连线顺序作为参考图 1～4 提交。',false,true),p('提示词包','json','可选 prompt.bundle，读取 prompt 与 style。'),p('提示词','text','可接多段文本，合并为生成描述。',false,true)],[p('图片','image','模型生成且成功落盘的图片。')]],
['P图','图像处理','image','以一张原图和修改说明调用图片编辑模型，得到修改后的新图。',[p('原图','image','待修改的单张图片。',true),p('修改说明','text','可接多段编辑要求并合并。',false,true)],[p('修改图','image','模型编辑完成后的新图片；原图保持不变。')]],
['生视频','模型生成','input','用文本及可选参考素材调用视频模型生成视频。',[p('图片','image','多张图片；首张作为主图/首帧，其余按序参考。',false,true),p('运动参考','video','可选参考视频，是否支持由具体模型决定。',false,true),p('参考音频','audio','可选音频参考，仅在模型支持时提交。',false,true),p('提示词包','json','可选 prompt.bundle。'),p('提示词','text','视频内容与运动描述，可接多段。',false,true)],[p('视频','video','模型成功生成并落盘的视频。')]],
['视频','素材输入','input','导入本地视频并向下游提供稳定的视频资产，不做模型生成。',[],[p('视频','video','不可变的视频资产引用。')]],
['抽帧','视频处理','video','从源视频提取首帧、尾帧或指定时间点为图片。',[p('源视频','video','需要抽帧的视频。',true)],[p('视频帧','image','指定时间点解码得到的新图片。')]],
['视频截取','视频处理','video','按起止毫秒截取视频，可保留视频、音频或两者。',[p('源视频','video','需要截取的视频。',true)],[p('视频片段','video','重编码后的 MP4 片段，可按设置不存在。'),p('音频片段','audio','同一时间范围提取的新音频，可按设置不存在。')]],
['截音频','历史兼容','video','已退役，功能已合并进“视频截取”；旧画布仍可运行，不能新建。',[p('源视频','video','要提取音频的视频。',true)],[p('音频片段','audio','指定范围提取并转码后的音频。')],'retired'],
['人声分离','音频语音','audio','把音频中的人声与伴奏分离；人声从端口输出，伴奏作为关联音频资产出现。',[p('源音频','audio','完整待分离音频。',true)],[p('人声','audio','分离出来的人声音轨。')]],
['音频','素材输入','input','导入、保存和预览本地音频，不执行合成。',[],[p('音频','audio','已导入音频资产的引用。')]],
['文件','素材输入','input','导入 Excel、Word、PDF 等文件；支持时抽取正文。',[],[p('文件','file','原始文件资产。'),p('文本','text','可抽取的正文，如 TXT、CSV、Office、PDF；无正文时不产生。')]],
['配音','模型生成','audio','按选择的语音协议把文本合成为音频；不同后端决定可用音色与字幕能力。',[p('文本','text','待朗读文本；具体端口随语音后端配置变化。',true),p('音色档案','json','部分后端可接音色 ID 档案；具体端口随后端变化。')],[p('音频','audio','本次合成成功后的配音音频。'),p('字幕','json','支持字幕的后端才会生成。')]],
['语音克隆','模型生成','audio','使用 MiniMax 云端或本地 IndexTTS 复刻声音，并按文本合成音频。',[p('参考语音','audio','可选上游参考音频，也可在节点中上传。'),p('文本','text','待朗读文本，可接多段并合并。',false,true)],[p('音频','audio','复刻声音合成后的音频。'),p('音色档案','json','MiniMax 返回的 voice_id；本地模式不产生。')]],
['音色设计','模型生成','audio','由自然语言描述设计全新音色，并提供试听与可复用档案。',[p('音色描述','text','描述声线、语速、情绪等，可接多段并合并。',false,true)],[p('试听音频','audio','服务端试听音频解码后的资产。'),p('音色档案','json','包含 voice_id，可直接连至配音节点。')]],
['对话','模型生成','audio','基于文本模型进行多轮对话；上游文本作为本轮输入或上下文，系统在 20 轮内保留完整对话。',[p('文本','text','本轮用户消息或上下文，可接多段。',false,true)],[p('回复','markdown','最后一条助手回复，保留 Markdown 语义。')]],
['脚本','历史兼容','logic','旧版复合脚本节点；新流程建议“文本 → AI 处理 → JSON/分镜板”。',[p('剧本文本','text','待拆解的剧本文本，可接多段。',false,true)],[p('分镜数据','json','分镜列表。'),p('分镜文本','text','旧版兼容的分镜摘要。')],'retired'],
['处理','逻辑流程','logic','传递一个连线值或固定值；可提取 JSON 字段、填充文本模板。',[p('输入变量','any','一个要传递或转换的值。')],[p('输出变量','any','处理后的值，实际类型由节点设置决定。')]],
['JSON','逻辑流程','logic','编辑、汇总并校验 JSON；也可把可解析文本转换为结构化数据。',[p('数据','json','多个结构化值，供汇总或展示。',false,true),p('文本','text','一段可被 JSON.parse 解析的文本。')],[p('数据','json','格式化且可校验的结构化值。')]],
['结构数据','逻辑流程','logic','按所选 Schema 校验 JSON 正文；支持用占位符显式引用上游值。',[p('结构上下文','json','多个结构化输入，可用 {{input[0].field}} 引用。',false,true),p('文本上下文','text','可用 {{text}} 引用的上游文本。',false,true)],[p('结构数据','json','通过所选 Schema 校验的 JSON。')]],
['代码','逻辑流程','logic','以受控输入执行代码转换，把 return 值写入命名输出变量。',[p('文本输入','text','运行时以 input.text 读取的合并文本。',false,true),p('数据输入','json','运行时以 input.json 读取的结构化值列表。',false,true),p('自定义参数','动态','在节点设置中声明的具名参数端口。')],[p('输出变量','动态','return 值；名称和类型由节点设置决定。')]],
['分镜板','逻辑流程','logic','将分镜 JSON 显示为可编辑镜头卡片，供预演和生成流程使用。',[p('分镜数据','json','符合分镜 Schema 的镜头列表。'),p('分镜文本','text','可解析为分镜 JSON 的兼容文本。')],[p('分镜数据','json','编辑后的完整分镜结构。'),p('合成文本','text','由画面、台词、时长生成的摘要。')]],
['AI 处理','模型生成','logic','将文本和 JSON 上下文交给文本模型，按配置返回文本、Markdown 或 JSON。',[p('文本','text','一个或多个待处理文本。',false,true),p('JSON 上下文','json','可选结构化上下文。')],[p('文本','text','模型纯文本结果。'),p('Markdown','markdown','模型 Markdown 结果。'),p('JSON','json','模型返回且校验后的结构化值。')]],
['循环','逻辑流程','logic','对 JSON 列表逐项运行后续子流程，并汇总每一项的执行结果。',[p('列表','json','每个元素将成为一次循环体输入。',true)],[p('当前项','iteration','普通项接 JSON 输入；包含明确媒体类型和完整资产引用的项可接同类型媒体输入，循环结束后不保留。'),p('结果列表','json','每项来源、状态与产物的结构化汇总。')]],
['3D 预演台','逻辑流程','logic','在白模空间中组织镜头。只有用户发布后，预演帧、视频等才成为可用下游输出。',[p('分镜','json','可选分镜；连线后需点“同步连线输入”。'),p('场景参考图','image','建议 1～3 张，用于建立白模空间。',false,true),p('机位参数','camera','可选初始机位，仅接受专用机位通道。')],[p('预演帧','image','用户发布的当前镜头静帧。'),p('预演视频','video','导出的 WebM 预演视频。'),p('机位参数','camera','已发布镜头的机位参数。'),p('工程摘要','json','可交换的镜头与机位摘要，不含媒体二进制。')]]
];
const grid=document.querySelector('#grid'), filters=document.querySelector('#filters');const groups=['全部',...new Set(nodes.map(n=>n[1]))];let active='全部';
function render(){filters.innerHTML=groups.map(x=>`<button class="${x===active?'active':''}" data-x="${x}">${x}</button>`).join('');grid.innerHTML=nodes.filter(n=>active==='全部'||n[1]===active).map(n=>{const ports=(a,empty)=>a.length?a.map(x=>`<div class="port"><i class="dot" style="--port:${C[n[2]]}"></i><div><b>${x.name}</b> <span class="tag">${x.type}</span>${x.required?' <span class="tag">必填</span>':''}${x.many?' <span class="tag">多值</span>':''}<small>${x.desc}</small></div></div>`).join(''):`<div class="empty">${empty}</div>`;return `<article class="card" style="--accent:${C[n[2]]}"><div class="meta"><span class="kind">${n[1]}</span>${n[6]==='retired'?'<span class="kind retired">不可新建</span>':''}</div><h2>${n[0]}</h2><p class="purpose">${n[3]}</p><div class="section"><h3>输入 · 连接到左侧</h3>${ports(n[4],'无输入端口；由节点本身保存的素材或配置提供数据。')}</div><div class="section"><h3>输出 · 连接到右侧</h3>${ports(n[5],'运行成功后才会产生输出。')}</div></article>`}).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.x;render()})};render();
</script></body></html>
